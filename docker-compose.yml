services:
  concierge:
    build: .
    ports:
      - "${BOT_PORT:-8080}:${BOT_PORT:-8080}"
    volumes:
      - ./config:/app/config:ro
      - ./checklists:/app/checklists:ro
      - ./data:/app/data
    env_file:
      - .env
    extra_hosts:
      - "ВАШ-MATTERMOST-HOSTNAME:10.221.0.195"   # замените на реальные hostname:IP
    restart: unless-stopped
